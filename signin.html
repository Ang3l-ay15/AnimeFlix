<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AnimeFlix | Sign In</title>

<link rel="icon"
href="images/logo.png">

<!-- Google Fonts -->

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Bebas+Neue&display=swap"
rel="stylesheet">

<!-- Icons -->

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<!-- CSS -->

<link rel="stylesheet"
href="css/auth.css">

</head>

<body>

<div class="background-overlay"></div>

<div class="auth-container">

<div class="auth-card">

<!-- Logo -->

<div class="logo">

<img src="images/logo.png"
alt="AnimeFlix">

<h1>AnimeFlix</h1>

<p>

Welcome back to your anime universe.

</p>

</div>

<!-- Tabs -->

<div class="tabs">

<button class="tab active"
id="loginTab">

Sign In

</button>

<button class="tab"
id="registerTab">

Create Account

</button>

</div>

<!-- ========================= -->
<!-- LOGIN FORM -->
<!-- ========================= -->

<form
id="loginForm">

<div class="input-group">

<label>Email Address</label>

<input

type="email"

placeholder="Enter your email"

required>

</div>

<div class="input-group">

<label>Password</label>

<div class="password-box">

<input

type="password"

id="loginPassword"

placeholder="Enter password"

required>

<button
type="button"
id="toggleLoginPassword">

<i class="fa-solid fa-eye"></i>

</button>

</div>

</div>

<div class="options">

<label>

<input
type="checkbox">

Remember Me

</label>

<a href="#">

Forgot Password?

</a>

</div>

<button
type="submit"
class="primary-btn">

Sign In

</button>

<div class="divider">

<span>

OR

</span>

</div>

<button
type="button"
class="google-btn">

<i class="fab fa-google"></i>

Continue with Google

</button>

<button
type="button"
class="discord-btn">

<i class="fab fa-discord"></i>

Continue with Discord

</button>

</form>

<!-- ========================= -->
<!-- REGISTER FORM -->
<!-- ========================= -->

<form
id="registerForm">

<div class="input-group">

<label>Username</label>

<input

type="text"

placeholder="Choose a username"

required>

</div>

<div class="input-group">

<label>Email</label>

<input

type="email"

placeholder="Enter your email"

required>

</div>

<div class="input-group">

<label>Password</label>

<div class="password-box">

<input

type="password"

id="registerPassword"

placeholder="Create password"

required>

<button
type="button"
id="toggleRegisterPassword">

<i class="fa-solid fa-eye"></i>

</button>

</div>

</div>

<div class="input-group">

<label>Confirm Password</label>

<input

type="password"

placeholder="Confirm password"

required>

</div>

<label class="terms">

<input
type="checkbox"
required>

I agree to the Terms &
Conditions.

</label>

<button
type="submit"
class="primary-btn">

Create Account

</button>

</form>

</div>

</div>

<script src="js/auth.js"></script>

</body>

</html>
